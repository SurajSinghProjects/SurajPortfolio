<head>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Oxygen:wght@700&family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Mulish:wght@200&family=Noto+Serif&family=Open+Sans+Condensed:wght@300&family=Open+Sans:wght@400;500&family=Poppins:wght@100;500&family=Source+Sans+Pro:wght@200&family=Work+Sans:wght@300&display=swap"

    <script src="js/bootstrap.bundle.js"></script>


    <title>form</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="write">
                    <h5>Write A review</h5>
                    <form action="#">
                        <div class="form-group "><label for="exampleFormControlInput1">Name</label> <input type="text" class="form-control" id="fname" name="fname" value="" placeholder="First Name:"> </div>
                        <div class="form-group">
                            <label for="exampleFormControlInput1">Email</label>
                            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                        </div>
                        <div class="form-group "><label for="exampleFormControlInput1">Location</label> <input type="text" class="form-control" id="fname" name="fname" value="" placeholder="eg: Paris,France"> </div>
                        <div class="form-group">
                            <label class="form-check-label d-block" for="inlineCheckbox1">Rating</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">

                            </div>
                        </div>

                        <div class="form-group "><label for="exampleFormControlInput1">Review Title</label> <input type="text" class="form-control" id="fname" name="fname" value="" placeholder="Give your review a title"> </div>

                        <div class="form-group">
                            <label for="exampleFormControlTextarea1">Body Of Review (1500)</label>
                            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Write your comments here"></textarea>
                        </div>

                        <div class="form-group">
                            <div class="col-md-12 text-right">
                                <button type="submit" class="btn btn-primary">Submit Review</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script>
        for (var a = 1; a <= 10; a++) {


            if (a == 4) {
                document.write("hey :" + a + "</br>");
                break;
            }
            document.write("Number :" + a + "</br>");
        }
    </script>

</body>

</html>
